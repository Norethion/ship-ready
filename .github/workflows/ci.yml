name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  katalog:
    name: Katalog doğrulama
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python uygulama/katalog.py dogrula

  site:
    name: Site build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Site girdilerini kontrol et
        id: changes
        shell: bash
        run: |
          git rev-parse -q --verify HEAD^1 >/dev/null || { echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }  # no base commit: run everything
          if [[ "${{ github.event_name }}" == "push" ]] || [[ -n "$(git diff --name-only HEAD^1 HEAD -- icerik/ veri/ site/ uygulama/)" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Bağımlılıkları kur
        if: steps.changes.outputs.code == 'true'
        working-directory: site
        run: npm ci
      - name: Herkese açık siteyi derle
        if: steps.changes.outputs.code == 'true'
        working-directory: site
        run: npm run build
